<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saçmaca — the soundtrack</title>
<link rel="stylesheet" href="style.css?v=salon-1">
</head>
<body>
<div id="mp3-player">
  <audio id="audio-player" src="music/song1.mp3" preload="none"></audio>
  <div class="track"><span class="record" aria-hidden="true">✳</span><div><span class="eyebrow">SAÇMACA AFTER HOURS</span><div id="track-name">Track 01 / 02</div></div><span id="player-status" role="status">Press play</span></div>
  <div class="playback"><div id="controls"><button id="prev" type="button" aria-label="Previous track">⏮</button><button id="play-pause" type="button" aria-label="Play" aria-pressed="false">▶</button><button id="next" type="button" aria-label="Next track">⏭</button></div><label class="volume" for="volume-slider">VOL <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7" aria-label="Volume"></label></div>
  <label class="seek" for="seek-slider"><span id="elapsed">0:00</span><input type="range" id="seek-slider" min="0" max="100" step="0.1" value="0" disabled aria-label="Playback position"><span id="duration">0:00</span></label>
  <noscript><audio controls src="music/song1.mp3" preload="none"></audio></noscript>
</div>
<script src="script.js?v=salon-1"></script>
</body></html>
